<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you Maria</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #12000f;
  }

  /* ---------- Fundo animado ---------- */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1200px 800px at 15% 10%, #3a0a2e 0%, transparent 60%),
      radial-gradient(1000px 700px at 85% 85%, #4a0b1f 0%, transparent 60%),
      radial-gradient(900px 900px at 50% 50%, #1d0218 0%, #0c000a 70%);
    animation: breathe 14s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { filter: brightness(0.85) saturate(0.95); }
    to   { filter: brightness(1.15) saturate(1.25); }
  }

  /* Coracoes subindo ao fundo */
  .heart {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    opacity: 0;
    color: #ff5f8f;
    text-shadow: 0 0 14px rgba(255, 70, 130, 0.85);
    animation: floatUp linear infinite;
    will-change: transform, opacity;
    user-select: none;
    pointer-events: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.7) rotate(0deg);   opacity: 0; }
    12%  { opacity: 0.85; }
    80%  { opacity: 0.55; }
    100% { transform: translateY(-110vh) scale(1.15) rotate(18deg); opacity: 0; }
  }

  /* Faixas de texto passando */
  #ticker {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .lane {
    white-space: nowrap;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.14);
    text-shadow: 0 0 24px rgba(255, 80, 140, 0.35);
    animation: slideX linear infinite;
    will-change: transform;
  }

  .lane span {
    display: inline-block;
    padding-right: 60px;
  }

  .lane.hi {
    color: rgba(255, 105, 160, 0.42);
    text-shadow: 0 0 34px rgba(255, 60, 130, 0.7);
  }

  @keyframes slideX {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .lane.rev { animation-name: slideXrev; }
  @keyframes slideXrev {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }

  /* ---------- Centro ---------- */
  #stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }

  #title {
    font-size: clamp(2.2rem, 9vw, 6rem);
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    text-shadow:
      0 0 18px rgba(255, 80, 150, 0.9),
      0 0 60px rgba(255, 40, 120, 0.6),
      0 0 120px rgba(255, 20, 100, 0.35);
    animation: pulse 3.2s ease-in-out infinite;
  }

  #title .heartMark {
    display: inline-block;
    animation: beat 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1);     filter: brightness(1); }
    50%      { transform: scale(1.035); filter: brightness(1.12); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.22); }
    40%      { transform: scale(1.02); }
    60%      { transform: scale(1.16); }
  }

  #subtitle {
    font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 200, 220, 0.75);
  }

  @media (prefers-reduced-motion: reduce) {
    .lane, .heart, #title, #bg { animation: none !important; }
  }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="ticker"></div>

  <div id="stage">
    <h1 id="title">I love you Maria <span class="heartMark">❤️</span></h1>
    <p id="subtitle">para sempre, Maria</p>
  </div>

<script>
  /* ================== Fundo com "I love you Maria" ================== */
  const PHRASE = "I love you Maria  ❤  ";
  const ticker = document.getElementById("ticker");
  const lanes = [
    { size: 5.5, dur: 46, hi: false, rev: false },
    { size: 3.2, dur: 34, hi: true,  rev: true  },
    { size: 8,   dur: 62, hi: false, rev: false },
    { size: 2.4, dur: 26, hi: true,  rev: false },
    { size: 6.5, dur: 52, hi: false, rev: true  },
    { size: 4.2, dur: 40, hi: true,  rev: false },
    { size: 9.5, dur: 70, hi: false, rev: true  },
    { size: 2.9, dur: 30, hi: false, rev: false }
  ];

  lanes.forEach((lane, i) => {
    const el = document.createElement("div");
    el.className = "lane" + (lane.hi ? " hi" : "") + (lane.rev ? " rev" : "");
    el.style.fontSize = lane.size + "vw";
    el.style.animationDuration = lane.dur + "s";
    el.style.animationDelay = (-i * 3.1) + "s";
    el.style.opacity = lane.hi ? "1" : "0.85";

    // duplicado para o loop ficar continuo
    const unit = PHRASE.repeat(14);
    el.innerHTML = "<span>" + unit + "</span><span>" + unit + "</span>";
    ticker.appendChild(el);
  });

  /* ================== Coracoes subindo ================== */
  const HEARTS = ["❤️", "💗", "💕", "🤍", "💖"];
  const bg = document.getElementById("bg");
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (14 + Math.random() * 26) + "px";
    h.style.animationDuration = (11 + Math.random() * 16) + "s";
    h.style.animationDelay = (-Math.random() * 22) + "s";
    bg.appendChild(h);
  }
</script>
</body>
</html>
