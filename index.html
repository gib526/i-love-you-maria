<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you Maria</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #12000f;
  }

  /* ---------- Fundo animado ---------- */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1200px 800px at 15% 10%, #3a0a2e 0%, transparent 60%),
      radial-gradient(1000px 700px at 85% 85%, #4a0b1f 0%, transparent 60%),
      radial-gradient(900px 900px at 50% 50%, #1d0218 0%, #0c000a 70%);
    animation: breathe 14s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { filter: brightness(0.85) saturate(0.95); }
    to   { filter: brightness(1.15) saturate(1.25); }
  }

  /* Corações subindo ao fundo */
  .heart {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    opacity: 0;
    color: #ff5f8f;
    text-shadow: 0 0 14px rgba(255, 70, 130, 0.85);
    animation: floatUp linear infinite;
    will-change: transform, opacity;
    user-select: none;
    pointer-events: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.7) rotate(0deg);   opacity: 0; }
    12%  { opacity: 0.85; }
    80%  { opacity: 0.55; }
    100% { transform: translateY(-110vh) scale(1.15) rotate(18deg); opacity: 0; }
  }

  /* Faixas de texto "I love you Maria" passando */
  #ticker {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .lane {
    white-space: nowrap;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.14);
    text-shadow: 0 0 24px rgba(255, 80, 140, 0.35);
    animation: slideX linear infinite;
    will-change: transform;
  }

  .lane span {
    display: inline-block;
    padding-right: 60px;
  }

  .lane.hi {
    color: rgba(255, 105, 160, 0.42);
    text-shadow: 0 0 34px rgba(255, 60, 130, 0.7);
  }

  @keyframes slideX {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .lane.rev { animation-name: slideXrev; }
  @keyframes slideXrev {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }

  /* ---------- Centro ---------- */
  #stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }

  #title {
    font-size: clamp(2.2rem, 9vw, 6rem);
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    text-shadow:
      0 0 18px rgba(255, 80, 150, 0.9),
      0 0 60px rgba(255, 40, 120, 0.6),
      0 0 120px rgba(255, 20, 100, 0.35);
    animation: pulse 3.2s ease-in-out infinite;
  }

  #title .heartMark {
    display: inline-block;
    animation: beat 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1);     filter: brightness(1); }
    50%      { transform: scale(1.035); filter: brightness(1.12); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.22); }
    40%      { transform: scale(1.02); }
    60%      { transform: scale(1.16); }
  }

  #subtitle {
    font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 200, 220, 0.75);
  }

  /* ---------- Player ---------- */
  #player {
    position: fixed;
    z-index: 3;
    left: 50%;
    transform: translateX(-50%);
    bottom: 26px;
    width: min(560px, calc(100% - 32px));
    padding: 14px 18px;
    border-radius: 18px;
    background: rgba(24, 4, 20, 0.62);
    border: 1px solid rgba(255, 110, 165, 0.28);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), inset 0 0 30px rgba(255, 60, 130, 0.07);
    color: #ffe6f0;
  }

  .row { display: flex; align-items: center; gap: 12px; }

  .songName { font-size: 0.9rem; font-weight: 700; }
  .songName small {
    display: block;
    font-weight: 400;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 190, 215, 0.7);
    margin-top: 2px;
  }

  button.play {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 17px;
    color: #2a0016;
    background: linear-gradient(145deg, #ffc2d9, #ff5f96);
    box-shadow: 0 8px 22px rgba(255, 60, 130, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.play:hover { transform: scale(1.07); box-shadow: 0 10px 28px rgba(255, 60, 130, 0.6); }
  button.play:active { transform: scale(0.96); }

  .bar {
    flex: 1;
    height: 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
    cursor: pointer;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ff9ec4, #ff3d7f);
  }

  .time {
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    color: rgba(255, 205, 225, 0.8);
    min-width: 84px;
    text-align: right;
  }

  .hint {
    margin-top: 8px;
    font-size: 0.7rem;
    color: rgba(255, 190, 215, 0.6);
  }

  /* Aviso clicável quando o navegador bloqueia autoplay */
  #unmute {
    position: fixed;
    z-index: 5;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 0, 8, 0.55);
    backdrop-filter: blur(4px);
    cursor: pointer;
    color: #fff;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 24px;
    text-shadow: 0 0 24px rgba(255, 80, 150, 0.9);
  }
  #unmute.show { display: flex; }

  .credits {
    position: fixed;
    right: 14px;
    top: 12px;
    z-index: 3;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 200, 220, 0.45);
  }

  @media (prefers-reduced-motion: reduce) {
    .lane, .heart, #title, #bg { animation: none !important; }
  }
</style>
</head>
<body>

  <div id="bg"></div>
  <div id="ticker"></div>

  <div id="stage">
    <h1 id="title">I love you Maria <span class="heartMark">❤️</span></h1>
    <p id="subtitle">para sempre, Maria</p>
  </div>

  <div class="credits">trilha: Samurai — Djavan</div>

  <div id="player">
    <div class="row">
      <button class="play" id="playBtn" aria-label="Tocar ou pausar">▶</button>
      <div class="songName">
        Samurai
        <small>Djavan</small>
      </div>
      <div class="time" id="time">0:00 / 0:00</div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="bar" id="bar"><i id="fill"></i></div>
      <button class="play" id="muteBtn" style="width:34px;height:34px;font-size:14px" aria-label="Volume">🔊</button>
    </div>
    <div class="hint" id="hint">coloque o arquivo <b>samurai.mp3</b> na mesma pasta deste site</div>
  </div>

  <div id="unmute">toque na tela para iniciar a música 🎵</div>

  <!-- Música de fundo -->
  <audio id="song" loop preload="auto">
    <source src="samurai.mp3" type="audio/mpeg">
  </audio>

<script>
  /* ================== Fundo com "I love you Maria" ================== */
  const PHRASE = "I love you Maria  ❤  ";
  const ticker = document.getElementById("ticker");
  const lanes = [
    { size: 5.5, dur: 46, hi: false, rev: false },
    { size: 3.2, dur: 34, hi: true,  rev: true  },
    { size: 8,   dur: 62, hi: false, rev: false },
    { size: 2.4, dur: 26, hi: true,  rev: false },
    { size: 6.5, dur: 52, hi: false, rev: true  },
    { size: 4.2, dur: 40, hi: true,  rev: false },
    { size: 9.5, dur: 70, hi: false, rev: true  },
    { size: 2.9, dur: 30, hi: false, rev: false }
  ];

  lanes.forEach((lane, i) => {
    const el = document.createElement("div");
    el.className = "lane" + (lane.hi ? " hi" : "") + (lane.rev ? " rev" : "");
    el.style.fontSize = lane.size + "vw";
    el.style.animationDuration = lane.dur + "s";
    el.style.animationDelay = (-i * 3.1) + "s";
    el.style.opacity = lane.hi ? "1" : "0.85";

    // duplicado para o loop ficar contínuo (translateX -50%)
    const unit = PHRASE.repeat(14);
    el.innerHTML = "<span>" + unit + "</span><span>" + unit + "</span>";
    ticker.appendChild(el);
  });

  /* ================== Corações subindo ================== */
  const HEARTS = ["❤️", "💗", "💕", "🤍", "💖"];
  const bg = document.getElementById("bg");
  for (let i = 0; i < 26; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (14 + Math.random() * 26) + "px";
    h.style.animationDuration = (11 + Math.random() * 16) + "s";
    h.style.animationDelay = (-Math.random() * 22) + "s";
    bg.appendChild(h);
  }

  /* ================== Player ================== */
  const audio  = document.getElementById("song");
  const playBtn = document.getElementById("playBtn");
  const muteBtn = document.getElementById("muteBtn");
  const bar    = document.getElementById("bar");
  const fill   = document.getElementById("fill");
  const timeEl = document.getElementById("time");
  const hint   = document.getElementById("hint");
  const unmute = document.getElementById("unmute");

  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60);
    const r = Math.floor(s % 60);
    return m + ":" + String(r).padStart(2, "0");
  };

  function setPlayIcon(playing) {
    playBtn.textContent = playing ? "❚❚" : "▶";
  }

  playBtn.addEventListener("click", () => {
    if (audio.paused) {
      audio.play().then(() => setPlayIcon(true)).catch(showUnmute);
    } else {
      audio.pause();
      setPlayIcon(false);
    }
  });

  audio.addEventListener("play",  () => setPlayIcon(true));
  audio.addEventListener("pause", () => setPlayIcon(false));
  audio.addEventListener("ended", () => setPlayIcon(false));

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
      fill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    }
    timeEl.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
  });

  audio.addEventListener("loadedmetadata", () => {
    timeEl.textContent = "0:00 / " + fmt(audio.duration);
    hint.textContent = "Samurai — Djavan · trilha de fundo";
  });

  audio.addEventListener("error", () => {
    hint.innerHTML = 'não encontrei o arquivo <b>samurai.mp3</b> nesta pasta';
  });

  bar.addEventListener("click", (e) => {
    if (!audio.duration) return;
    const rect = bar.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  muteBtn.addEventListener("click", () => {
    audio.muted = !audio.muted;
    muteBtn.textContent = audio.muted ? "🔇" : "🔊";
  });

  function showUnmute() { unmute.classList.add("show"); }
  unmute.addEventListener("click", () => {
    unmute.classList.remove("show");
    audio.volume = 1;
    audio.play().then(() => setPlayIcon(true)).catch(() => {});
  });

  // tenta tocar sozinho; se o navegador bloquear, mostra o aviso de toque
  window.addEventListener("load", () => {
    audio.volume = 0.75;
    const p = audio.play();
    if (p && p.catch) p.catch(showUnmute);
  });

  // autoplay liberado por navegador só após interação — reforço em qualquer clique
  ["click", "keydown", "touchstart"].forEach(ev =>
    window.addEventListener(ev, function once() {
      if (audio.paused) audio.play().catch(() => {});
      window.removeEventListener(ev, once);
    }, { once: true })
  );
</script>
</body>
</html>
